name: Verify Inundra

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-contracts-and-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Synthetic contract and frontend tests
        run: |
          python -m pytest -q
          python scripts/check_inundra_lab.py
          node --check inundra/static/app.js
          node --check inundra/static/model.js
          node --test tests/inundra.test.cjs
      - name: Build and smoke-test local-only container
        run: |
          docker build -t inundra:ci .
          docker run -d --rm --name inundra-ci --read-only --tmpfs /tmp:rw,nosuid,size=128m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8000:8000 inundra:ci
          python scripts/smoke_inundra.py
          test "$(docker exec inundra-ci id -u)" != "0"
      - name: Stop test container
        if: always()
        run: docker stop inundra-ci || true
