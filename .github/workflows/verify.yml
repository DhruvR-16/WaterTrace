name: Verify ChartCourt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install OCR and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install -r requirements-dev.txt
          python -m pip check
          tesseract --version
      - name: Python and frontend regression tests
        run: |
          python -m pytest -q
          node --check app/static/app.js
          node --check app/static/network.js
          node --test tests/network.test.cjs
      - name: Evaluate synthetic charts and transformations
        run: |
          mkdir -p artifacts
          python scripts/evaluate.py --suite all > artifacts/evaluation.json
          python scripts/evaluate_variants.py --suite all --summary --min-supported-coverage 0.95 > artifacts/variants.json
          python -m app.cli app/static/samples/honest.png --output artifacts/cli-report.json --fail-on-findings
      - name: Build and smoke-test the runtime container
        run: |
          docker build -t chartcourt:ci .
          docker run -d --rm --name chartcourt-ci --read-only --tmpfs /tmp:rw,nosuid,size=128m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8000:8000 chartcourt:ci
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/api/health -o artifacts/container-health.json
          curl --fail http://127.0.0.1:8000/api/analyze -F 'file=@app/static/samples/truncated.png' -o artifacts/container-inspection.json
          python -c 'import json; h=json.load(open("artifacts/container-health.json")); r=json.load(open("artifacts/container-inspection.json")); assert h["ocr_available"] and h["opencv"].startswith("5."); assert r["status"] == "flagged" and len(r["bars"]) == 4'
          test "$(docker exec chartcourt-ci id -u)" != "0"
      - name: Stop test container
        if: always()
        run: docker stop chartcourt-ci || true
      - name: Save synthetic evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chartcourt-verification
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7
